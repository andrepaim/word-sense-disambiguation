name: Test


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


# Tests need a WordNet API. Repositories that set the WORDNET_URL variable use that server; anywhere else
# (e.g. forks) the public API image runs as a service container. An empty image skips the service.
env:
  WORDNET_URL: ${{ vars.WORDNET_URL || 'http://127.0.0.1:8000' }}


jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      wordnet:
        image: ${{ vars.WORDNET_URL == '' && 'ghcr.io/sign/wn:latest' || '' }}
        ports:
          - 8000:8080

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: uv pip install ".[dev,web,benchmark]"  # benchmark: wn, imported by training.train via wsd.benchmark

      - name: Wait for the WordNet API
        run: timeout 120 bash -c 'until curl -sf "$WORDNET_URL/health" > /dev/null; do sleep 2; done'

      - name: Test Code
        run: uv run pytest -n auto --dist loadscope

  # The default model must keep its published accuracy on the WordNet held-out slice (wsd/README.md: 75.9% for
  # sign/Ettin-150m-WSD). Update the threshold together with the model or the published number.
  accuracy:
    name: Accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      wordnet:
        image: ${{ vars.WORDNET_URL == '' && 'ghcr.io/sign/wn:latest' || '' }}
        ports:
          - 8000:8080

    steps:
      - uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true

      - name: Install dependencies
        run: uv pip install ".[benchmark]"

      - name: Wait for the WordNet API
        run: timeout 120 bash -c 'until curl -sf "$WORDNET_URL/health" > /dev/null; do sleep 2; done'

      - name: Benchmark the held-out slice
        run: uv run python -m wsd.benchmark --split eval --min-accuracy 0.759
