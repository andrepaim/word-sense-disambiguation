name: CPU Docker platforms

on:
  pull_request:
    # Everything the image is built from: a dependency or code change can break the build or its
    # end-to-end check (wsd/prime.py), which otherwise first fails when a release is published.
    paths:
      - Dockerfile
      - pyproject.toml
      - "wsd/**"
      - "!wsd/**/*.md"
      - .github/workflows/publish-docker.yaml
      - .github/workflows/docker-cpu.yaml

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - run: >-
          docker buildx build
          --build-arg TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
          --build-arg MODEL_VERSION=ci .
